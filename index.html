<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@anton:~#</title>
    <style>
        :root { --bg: #0f0f0f; --text: #cccccc; --accent: #f76572; --pic: #404040;}
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            padding: 2rem;
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }
        a { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent); }
        a:hover { background-color: var(--accent); color: var(--bg); text-decoration: none; }
        
        .cmd { color: var(--accent); margin-right: 10px; }
        .section { margin-bottom: 2rem; }
        
        .header-container {
			margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 20px; 
            margin-bottom: 1rem;
        }
        
        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%; 
            object-fit: cover;  
            border: 2px solid var(--pic); 
        }
        @media (max-width: 600px) {
            .header-container { flex-direction: column; align-items: flex-start; }
        }

        .cursor { display: inline-block; width: 10px; height: 1.2em; background: var(--accent); vertical-align: text-bottom; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        
        h1 { font-size: 1.2rem; margin: 0 0 0.5rem 0; font-weight: normal; }
        ul { list-style-type: none; padding: 0; }
        li::before { content: "> "; color: var(--accent); }
    </style>
</head>
<body>
    <div class="section">
        <span class="cmd">root@anton:~$</span>./whoami
        
        <div class="header-container">
            <img src="me.jpg" alt="Anton" class="profile-pic">
            
            <div>
                <h1>Anton / Backend Developer & Game Dev</h1>
                <small>📍 Wrocław, PL</small>
            </div>
        </div>
    </div>

    <div class="section">
        <span class="cmd">root@anton:~$</span>cat skills.txt
        <ul>
            <li>.NET Core / C#</li>
            <li>Backend Architecture</li>
            <li>Game Dev Tools (Unity)</li>
        </ul>
    </div>

    <div class="section">
        <span class="cmd">root@anton:~$</span>ls contacts/
        <br>
        <a href="https://github.com/TryAntik" target="_blank">GitHub</a>
        <span style="margin: 0 10px;">|</span>
        <a href="mailto:dev@hentaiboss.pro">Email</a>
        <span style="margin: 0 10px;">|</span>
        <a href="https://t.me/orion_arrow">Telegram</a>
        <span class="cursor"></span>
    </div>
</body>
</html>
